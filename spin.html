<script>
/* ================= CONFIG ================= */
const API_BASE = "https://lethalorca-backend.vercel.app";
const ENDPOINTS = {
  status:   "/api/spin/status",
  spin:     "/api/spin/play",
  withdraw: "/api/withdraw",
};
const DEMO_MODE = false;
const MAX_SPINS_PER_DAY = 5;

const SEGMENTS = [
  { label: "0",    amount: 0,    weight: 30, color: "#0F3654" },
  { label: "10",   amount: 10,   weight: 25, color: "#123B5E" },
  { label: "20",   amount: 20,   weight: 18, color: "#0F3654" },
  { label: "50",   amount: 50,   weight: 12, color: "#123B5E" },
  { label: "100",  amount: 100,  weight: 8,  color: "#0F3654" },
  { label: "250",  amount: 250,  weight: 4,  color: "#123B5E" },
  { label: "500",  amount: 500,  weight: 2,  color: "#123B5E" },
  { label: "JACKPOT\n1000", amount: 1000, weight: 1, color: "#7A1F1F" },
];

/* ================= STATE ================= */
let wallet = null;
let spinning = false;
let cooldownTimer = null;
let currentBalance = 0;
let spinsUsed = 0;

/* ================= DRAW WHEEL ================= */
const wheel = document.getElementById('wheel');
const n = SEGMENTS.length;
const R = 150, CX = 150, CY = 150;
const anglePer = 360 / n;

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function shade(hex, amt){
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r = Math.min(255, Math.max(0,(num>>16)+amt));
  let g = Math.min(255, Math.max(0,((num>>8)&0xff)+amt));
  let b = Math.min(255, Math.max(0,(num&0xff)+amt));
  return `rgb(${r},${g},${b})`;
}

function buildWheel(){
  let defs = `<defs>
    <filter id="segShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="hubShine" cx="35%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  SEGMENTS.forEach((seg,i)=>{
    defs += `<linearGradient id="segGrad${i}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${shade(seg.color, 26)}"/>
      <stop offset="55%" stop-color="${seg.color}"/>
      <stop offset="100%" stop-color="${shade(seg.color, -22)}"/>
    </linearGradient>`;
  });

  let svg = defs;
  for(let i=0;i<n;i++){
    const start = i * anglePer;
    const end = start + anglePer;
    const [x1,y1] = polar(CX,CY,R,start);
    const [x2,y2] = polar(CX,CY,R,end);
    const largeArc = anglePer > 180 ? 1 : 0;
    svg += `<path d="M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${largeArc} 1 ${x2},${y2} Z" fill="url(#segGrad${i})" stroke="#020a10" stroke-width="1.5" filter="url(#segShadow)"/>`;
    const mid = start + anglePer/2;
    const [tx,ty] = polar(CX,CY,R*0.66,mid);
    const lines = SEGMENTS[i].label.split("\n");
    svg += `<g transform="translate(${tx},${ty}) rotate(${mid})">`;
    lines.forEach((line, idx) => {
      svg += `<text x="0" y="${idx*13 - (lines.length-1)*6}" text-anchor="middle" fill="#EAFFFB" font-size="15" font-weight="700" font-family="Baloo 2, sans-serif" stroke="#061019" stroke-width="0.4" style="filter:drop-shadow(0 0 3px rgba(45,212,196,0.55))">${line}</text>`;
    });
    svg += `</g>`;
  }
  svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="url(#hubShine)"/>`;
  wheel.innerHTML = svg;
}
buildWheel();

/* ================= WEIGHTED PICK ================= */
function weightedPick(){
  const total = SEGMENTS.reduce((s,x)=>s+x.weight,0);
  let r = Math.random() * total;
  for(let i=0;i<SEGMENTS.length;i++){
    r -= SEGMENTS[i].weight;
    if(r <= 0) return i;
  }
  return 0;
}

/* ================= PHANTOM WALLET ================= */
const walletBtn = document.getElementById('walletBtn');
const spinBtn = document.getElementById('spinBtn');
const balanceText = document.getElementById('balanceText');
const statusEl = document.getElementById('status');
const cooldownText = document.getElementById('cooldownText');

async function connectWallet(){
  const provider = window?.solana;

  if(provider && provider.isPhantom){
    try{
      const resp = await provider.connect();
      wallet = resp.publicKey.toString();
    }catch(e){
      statusEl.textContent = "Wallet connection cancelled.";
      return;
    }
  }else if(DEMO_MODE){
    wallet = "Demo" + Math.random().toString(36).slice(2,10);
    statusEl.textContent = "Phantom not detected — using a demo wallet for preview.";
  }else{
    statusEl.textContent = "Phantom wallet not found — install it from phantom.app";
    return;
  }

  walletBtn.textContent = wallet.slice(0,4) + "…" + wallet.slice(-4);
  walletBtn.classList.add('connected');
  spinBtn.disabled = false;
  spinBtn.textContent = "SPIN NOW";
  withdrawBtn.disabled = false;
  document.getElementById('withdrawWallet').value = wallet;
  refreshStatus();
  updateSpinCountDisplay();
}
walletBtn.addEventListener('click', ()=>{
  if(!wallet) connectWallet();
});

/* ================= BACKEND CALLS ================= */
async function refreshStatus(){
  if(DEMO_MODE){
    currentBalance = 1240;
    balanceText.textContent = `Balance: ${currentBalance.toLocaleString()} $LORCA (demo)`;
    document.getElementById('modalBalance').textContent = currentBalance.toLocaleString();
    return;
  }
  try{
    const r = await fetch(`${API_BASE}${ENDPOINTS.status}?wallet=${wallet}`);
    const data = await r.json();
    currentBalance = data.balance;
    balanceText.textContent = `Balance: ${data.balance} $LORCA`;
    document.getElementById('modalBalance').textContent = data.balance;
    if(!data.canSpin){
      spinBtn.disabled = true;
      startCooldownDisplay(data.secondsLeft);
    }
  }catch(e){
    balanceText.textContent = "Could not reach LethalOrca backend.";
  }
}

function updateSpinCountDisplay(){
  const el = document.getElementById('spinsLeftText');
  const left = Math.max(0, MAX_SPINS_PER_DAY - spinsUsed);
  el.textContent = `Spins left today: ${left}/${MAX_SPINS_PER_DAY}`;
  if(left === 0){
    spinBtn.disabled = true;
    statusEl.textContent = "Daily spin limit reached — come back tomorrow!";
  }
}

function startCooldownDisplay(seconds){
  clearInterval(cooldownTimer);
  let left = seconds;
  cooldownTimer = setInterval(()=>{
    left--;
    if(left <= 0){
      clearInterval(cooldownTimer);
      cooldownText.textContent = "";
      spinBtn.disabled = false;
      return;
    }
    const m = Math.floor(left/60), s = left%60;
    cooldownText.textContent = `Next spin in ${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

async function requestSpinResult(){
  if(DEMO_MODE){
    await new Promise(res=>setTimeout(res, 400));
    const idx = weightedPick();
    return { index: idx, amount: SEGMENTS[idx].amount };
  }
  const r = await fetch(`${API_BASE}${ENDPOINTS.spin}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ wallet })
  });
  if(!r.ok) throw new Error("spin failed");
  const data = await r.json();
  const idx = SEGMENTS.findIndex(s => s.amount === data.amount);
  return { index: idx >= 0 ? idx : 0, amount: data.amount, balance: data.balance, secondsLeft: data.secondsLeft };
}

/* ================= SPIN ANIMATION ================= */
let currentRotation = 0;
spinBtn.addEventListener('click', async ()=>{
  if(spinning || !wallet) return;
  if(spinsUsed >= MAX_SPINS_PER_DAY){
    statusEl.textContent = "Daily spin limit reached — come back tomorrow!";
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Spinning…";

  let result;
  try{
    result = await requestSpinResult();
  }catch(e){
    statusEl.textContent = "Could not reach LethalOrca backend. Try again.";
    spinning = false;
    spinBtn.disabled = false;
    return;
  }

  const targetSegMid = result.index * anglePer + anglePer/2;
  const extraSpins = 5 + Math.floor(Math.random()*2);
  const finalRotation = currentRotation + (extraSpins*360) + (360 - targetSegMid);
  currentRotation = finalRotation % 360;
  wheel.style.transform = `rotate(${finalRotation}deg)`;

  setTimeout(()=>{
    spinning = false;
    spinsUsed++;
    updateSpinCountDisplay();
    if(result.amount > 0){
      statusEl.className = "win";
      statusEl.textContent = `🎉 You won ${result.amount} $LORCA!`;
      launchCoins();
    }else{
      statusEl.textContent = "No luck this time — spin again soon!";
    }
    if(DEMO_MODE){
      currentBalance += result.amount;
      balanceText.textContent = `Balance: ${currentBalance.toLocaleString()} $LORCA (demo)`;
      document.getElementById('modalBalance').textContent = currentBalance.toLocaleString();
      spinBtn.disabled = spinsUsed >= MAX_SPINS_PER_DAY;
    }else{
      currentBalance = result.balance;
      balanceText.textContent = `Balance: ${result.balance} $LORCA`;
      document.getElementById('modalBalance').textContent = result.balance;
      startCooldownDisplay(result.secondsLeft || 3600);
    }
  }, 4600);
});

/* ================= FX: coin burst ================= */
function launchCoins(){
  const stage = document.querySelector('.wheel-stage').getBoundingClientRect();
  for(let i=0;i<14;i++){
    const c = document.createElement('div');
    c.className = 'coin-fx';
    c.textContent = '🪙';
    c.style.left = (stage.left + stage.width/2 + (Math.random()*40-20)) + 'px';
    c.style.top = (stage.top + stage.height/2) + 'px';
    c.style.setProperty('--dx', (Math.random()*160-80)+'px');
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 1000);
  }
}

/* ================= WITHDRAW ================= */
const withdrawBtn = document.getElementById('withdrawBtn');
const withdrawModal = document.getElementById('withdrawModal');
const withdrawAmount = document.getElementById('withdrawAmount');
const withdrawConfirm = document.getElementById('withdrawConfirm');
const withdrawCancel = document.getElementById('withdrawCancel');
const withdrawMsg = document.getElementById('withdrawMsg');

withdrawBtn.addEventListener('click', ()=>{
  if(!wallet) return;
  withdrawAmount.value = "";
  withdrawMsg.textContent = "";
  withdrawModal.classList.add('open');
});
withdrawCancel.addEventListener('click', ()=> withdrawModal.classList.remove('open'));
withdrawModal.addEventListener('click', (e)=>{ if(e.target === withdrawModal) withdrawModal.classList.remove('open'); });

withdrawConfirm.addEventListener('click', async ()=>{
  const amt = Number(withdrawAmount.value);
  if(!amt || amt <= 0){
    withdrawMsg.style.color = "var(--coral)";
    withdrawMsg.textContent = "Enter a valid amount.";
    return;
  }
  if(amt > currentBalance){
    withdrawMsg.style.color = "var(--coral)";
    withdrawMsg.textContent = "Amount exceeds your balance.";
    return;
  }
  withdrawConfirm.disabled = true;
  withdrawMsg.style.color = "var(--ink-dim)";
  withdrawMsg.textContent = "Processing withdrawal…";

  if(DEMO_MODE){
    await new Promise(res=>setTimeout(res, 1200));
    currentBalance -= amt;
    balanceText.textContent = `Balance: ${currentBalance.toLocaleString()} $LORCA (demo)`;
    document.getElementById('modalBalance').textContent = currentBalance.toLocaleString();
    withdrawMsg.style.color = "var(--mint)";
    withdrawMsg.textContent = `Sent ${amt} $LORCA to your wallet (demo).`;
    withdrawConfirm.disabled = false;
    setTimeout(()=> withdrawModal.classList.remove('open'), 1400);
    return;
  }

  try{
    const r = await fetch(`${API_BASE}${ENDPOINTS.withdraw}`, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ receiverAddress: wallet, amount: amt })
    });
    const data = await r.json();
    if(!r.ok || !data.success) throw new Error(data.message || "failed");
    currentBalance = data.balance;
    balanceText.textContent = `Balance: ${data.balance} $LORCA`;
    document.getElementById('modalBalance').textContent = data.balance;
    withdrawMsg.style.color = "var(--mint)";
    withdrawMsg.textContent = `Withdrawal sent. Tx: ${data.txSignature.slice(0,10)}…`;
    setTimeout(()=> withdrawModal.classList.remove('open'), 1800);
  }catch(e){
    withdrawMsg.style.color = "var(--coral)";
    withdrawMsg.textContent = "Withdrawal failed. Try again.";
  }
  withdrawConfirm.disabled = false;
});

/* ================= ambient bubbles ================= */
for(let i=0;i<16;i++){
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 6 + Math.random()*18;
  b.style.width = size+'px';
  b.style.height = size+'px';
  b.style.left = Math.random()*100+'vw';
  b.style.setProperty('--drift', (Math.random()*60-30)+'px');
  b.style.animationDuration = (8+Math.random()*10)+'s';
  b.style.animationDelay = (Math.random()*10)+'s';
  document.body.appendChild(b);
}
</script>
