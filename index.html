<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethal Orca | Official Airdrop & Community</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- HERO SECTION STYLES --- */
        .hero {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 3rem;
            color: #00d2ff;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* HERO AIRDROP BUTTON */
        .airdrop-hero-btn {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #0b0f19;
            background: linear-gradient(135deg, #00ffcc, #00d2ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .airdrop-hero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
        }

        /* --- MODAL / POPUP STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .container {
            background: #131c2e;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .container {
            transform: scale(1);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 24px;
            cursor: pointer;
            width: auto;
            padding: 0;
        }
        .close-btn:hover {
            color: #fff;
        }

        /* --- FORM STYLES --- */
        .container h2 {
            color: #00d2ff;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .container p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .ca-box {
            background: #0b0f19;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px dashed #334155;
        }
        label.field-label {
            display: block;
            text-align: left;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
            margin-top: 2px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00d2ff;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #statusMsg {
            margin-top: 15px;
            font-size: 14px;
        }
        .socials {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .socials a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .socials a:hover {
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <div class="hero">
        <h1>🌊 Lethal Orca</h1>
        <p>Built in open water. Pair a genuinely fun, free-to-play arcade game with a community-first token on Solana.</p>
        
        <!-- HERO AIRDROP BUTTON -->
        <button class="airdrop-hero-btn" onclick="openAirdropModal()">
            🪂 Join $LCr Airdrop
        </button>
    </div>

    <!-- POPUP MODAL -->
    <div class="modal-overlay" id="airdropModal">
        <div class="container">
            <button class="close-btn" onclick="closeAirdropModal()">&times;</button>
            <h2>🌊 Lethal Orca Airdrop</h2>
            <p>Drop your Solana wallet address below to participate in the official $LCr airdrop event!</p>
            
            <div class="ca-box">
                <strong>CA:</strong> 7RqpgT532tsYakbgnTXECC4MHTE
            </div>

            <label class="field-label" for="solAddress">Solana Wallet Address</label>
            <input type="text" id="solAddress" placeholder="Enter your Solana Wallet Address..." />

            <label class="field-label" for="xHandle">Your X (Twitter) Profile Link</label>
            <input type="text" id="xHandle" placeholder="e.g. https://x.com/yourusername" />

            <button id="submitBtn" class="submit-btn">Submit Address</button>
            
            <p id="statusMsg"></p>

            <div class="socials">
                <a href="https://t.me/Lethal_Orca" target="_blank">Telegram</a>
                <a href="https://discord.gg/bXkMYsThv" target="_blank">Discord</a>
                <a href="https://x.com/lethalorcatdo" target="_blank">Twitter / X</a>
            </div>
        </div>
    </div>

    <script>
        // --- POPUP / MODAL LOGIC & URL ROUTING ---
        function openAirdropModal() {
            document.getElementById('airdropModal').classList.add('active');
            window.location.hash = 'airdrop';
        }

        function closeAirdropModal() {
            document.getElementById('airdropModal').classList.remove('active');
            history.pushState("", document.title, window.location.pathname + window.location.search);
        }

        // Check URL on page load (e.g. yoursite.com/#airdrop)
        window.addEventListener('load', () => {
            if (window.location.hash === '#airdrop') {
                openAirdropModal();
            }
        });

        // --- SUPABASE & TELEGRAM LOGIC ---
        const SUPABASE_URL = 'https://obzyiecwhfdanzjtuhiq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ienlpZWN3aGZkYW56anR1aGlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA5MjYsImV4cCI6MjEwMTAwNjkyNn0.gYPNd5oH9hPaTLWoJkDDx-eTfkm_AXIjsj-ycHowpuc';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TELEGRAM_BOT_TOKEN = '8689687590:AAHSzJ_36tERZZzo4LhSMIavF30lUZI18wE';
        const TELEGRAM_CHAT_ID = '7586392121';

        async function sendTelegramAlert(wallet, xHandle) {
            const message = `🚨 New Airdrop Submission!\n\nWallet: \`${wallet}\`\nX Profile: ${xHandle ? xHandle : 'Not provided'}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                console.log("Telegram API Response:", result);
            } catch (err) {
                console.error("Telegram fetch error caught:", err);
            }
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const address = document.getElementById('solAddress').value.trim();
            const xHandle = document.getElementById('xHandle').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            if(address.length < 32 || address.length > 44) {
                statusMsg.innerText = "❌ Please enter a valid Solana address!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.innerText = "";
            
            try {
                const { data, error } = await supabaseClient
                    .from('airdrop_submissions')
                    .insert([{ wallet_address: address, x_profile: xHandle || null }]);

                await sendTelegramAlert(address, xHandle);

                if (error) {
                    if (error.code === '23505' || error.status === 409) {
                        statusMsg.innerText = "⚠️ This wallet address is already registered!";
                        statusMsg.style.color = "#ffa500";
                    } else {
                        statusMsg.innerText = "❌ Error: " + error.message;
                        statusMsg.style.color = "#ff4d4d";
                    }
                } else {
                    statusMsg.innerText = "✅ Success! Your address has been recorded.";
                    statusMsg.style.color = "#4bb543";
                    document.getElementById('solAddress').value = "";
                    document.getElementById('xHandle').value = "";
                }
            } catch (err) {
                console.error("Main Catch Error:", err);
                statusMsg.innerText = "❌ Something went wrong!";
                statusMsg.style.color = "#ff4d4d";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Address";
            }
        });
    </script>
</body>
</html>
