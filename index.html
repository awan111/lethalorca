<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LORCA Staking Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --abyss: #020910;
    --deep: #05121e;
    --deep2: #081a2b;
    --teal: #2dd4bf;
    --teal-glow: #5eead4;
    --gold: #f2c94c;
    --ink: #f4fcfc;
    --muted: #8ab4b4;
    --line: rgba(94, 234, 212, 0.2);
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--abyss);
    color: var(--ink);
    font-family: var(--body);
    padding: 20px;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1000px;
    margin: 0 auto 40px auto;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
  }
  .logo { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--teal-glow); text-decoration: none; }
  .btn-wallet {
    background: linear-gradient(135deg, var(--teal-glow), var(--teal));
    color: var(--abyss);
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--body);
    transition: all 0.3s ease;
  }
  .btn-wallet:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(45, 212, 191, 0.4); }

  .container { max-width: 1000px; margin: 0 auto; }
  .pool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .pool-card {
    background: var(--deep);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    transition: border 0.3s;
  }
  .pool-card:hover { border-color: var(--teal-glow); }
  .pool-card h3 { font-family: var(--display); font-size: 22px; margin-bottom: 8px; }
  .pool-card .apr { font-family: var(--mono); font-size: 28px; color: var(--gold); margin: 12px 0; }
  .pool-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-family: var(--mono); }
  .input-group input {
    width: 100%;
    padding: 12px;
    background: var(--deep2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: #fff;
    font-family: var(--mono);
    outline: none;
  }
  .btn-stake {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), #ffb347);
    color: #2a1f00;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 15px;
    transition: transform 0.2s;
  }
  .btn-stake:hover { transform: translateY(-2px); }

  .my-stakes {
    background: var(--deep);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
  }
  .my-stakes h3 { font-family: var(--display); font-size: 20px; margin-bottom: 16px; }
  .stake-list-item {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">← LETHALORCA</a>
  <button id="connectWalletBtn" class="btn-wallet" onclick="connectWallet()">Connect Phantom Wallet</button>
</header>

<div class="container">
  <h2 style="font-family: var(--display); font-size: 32px; margin-bottom: 24px;">$LORCA Staking Pools</h2>

  <div class="pool-grid">
    <!-- Pool 1 -->
    <div class="pool-card">
      <h3>30 Days Lock</h3>
      <div class="apr">12% APR</div>
      <p>Lock $LORCA tokens for 30 days to earn staking rewards.</p>
      <div class="input-group">
        <label>AMOUNT TO STAKE</label>
        <input type="number" id="stakeAmount30" placeholder="e.g. 1000">
      </div>
      <button class="btn-stake" onclick="handleStakeAction('pool-30', 30, 12, 'stakeAmount30')">Stake LORCA</button>
    </div>

    <!-- Pool 2 -->
    <div class="pool-card">
      <h3>90 Days Lock</h3>
      <div class="apr">25% APR</div>
      <p>Higher yield pool for long-term LORCA holders.</p>
      <div class="input-group">
        <label>AMOUNT TO STAKE</label>
        <input type="number" id="stakeAmount90" placeholder="e.g. 1000">
      </div>
      <button class="btn-stake" onclick="handleStakeAction('pool-90', 90, 25, 'stakeAmount90')">Stake LORCA</button>
    </div>
  </div>

  <div class="my-stakes">
    <h3>Your Active Stakes</h3>
    <div id="stakesContainer">
      <div style="color: var(--muted); font-size: 14px;">Connect your Phantom Wallet to view your active stakes.</div>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "https://lethalorca-backend.vercel.app/api/stake";
let userWallet = null;

// Wallet Connection Handler
async function connectWallet() {
  try {
    if (!window.solana || !window.solana.isPhantom) {
      alert("Phantom Wallet is not installed. Please install Phantom Wallet to proceed.");
      window.open("https://phantom.app/", "_blank");
      return;
    }

    const response = await window.solana.connect();
    userWallet = response.publicKey.toString();

    const connectBtn = document.getElementById("connectWalletBtn");
    if (connectBtn) {
      connectBtn.innerText = `Connected (${userWallet.slice(0, 4)}...${userWallet.slice(-4)})`;
    }

    fetchUserData(userWallet);

  } catch (error) {
    console.error("Wallet Connection Error:", error);
    alert("Wallet connection failed. Please try again.");
  }
}

// Fetch Active User Stakes
async function fetchUserData(wallet) {
  const container = document.getElementById("stakesContainer");
  try {
    const res = await fetch(`${BACKEND_URL}?action=list&wallet=${wallet}`);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    
    const data = await res.json();
    if (data.success && data.stakes && data.stakes.length > 0) {
      container.innerHTML = data.stakes.map(s => `
        <div class="stake-list-item">
          <span>${s.amount} LORCA (${s.days} Days)</span>
          <span style="color: var(--gold);">${s.apr}% APR</span>
        </div>
      `).join('');
    } else {
      container.innerHTML = `<div style="color: var(--muted); font-size: 14px;">No active stakes found for this wallet.</div>`;
    }
  } catch (err) {
    console.error("Backend fetch failed:", err);
    container.innerHTML = `<div style="color: #ff5555; font-size: 14px;">Failed to load staking data from backend.</div>`;
  }
}

// Handle Staking Action
async function handleStakeAction(poolId, days, apr, inputId) {
  if (!userWallet || !window.solana || !window.solana.isConnected) {
    alert("Please connect your Phantom Wallet first.");
    return;
  }

  const amountInput = document.getElementById(inputId);
  const amount = amountInput ? amountInput.value : null;

  if (!amount || parseFloat(amount) <= 0) {
    alert("Please enter a valid amount to stake.");
    return;
  }

  try {
    const res = await fetch(`${BACKEND_URL}?action=create`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        wallet: userWallet,
        amount: parseFloat(amount),
        poolId: poolId,
        days: days,
        apr: apr
      })
    });

    const data = await res.json();
    if (data.success) {
      alert("Successfully staked LORCA!");
      amountInput.value = "";
      fetchUserData(userWallet);
    } else {
      alert(`Staking failed: ${data.error || "Unknown error"}`);
    }
  } catch (err) {
    console.error("Staking request failed:", err);
    alert("Network error while processing stake request. Please try again.");
  }
}
</script>

</body>
</html>
