<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website - Toad Runner</title>
  <style>
    /* Button Styling */
    .play-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #20b2aa;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    
    .play-btn:hover {
      background-color: #16857f;
    }

    /* Game Container Modal Styling */
    .game-modal {
      display: none; /* Initially Hidden */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Responsive Iframe Container */
    .iframe-wrapper {
      position: relative;
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Close Button */
    .close-btn {
      margin-bottom: 10px;
      padding: 8px 16px;
      background-color: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Game Website</h1>
  
  <!-- Play Game Button -->
  <button class="play-btn" onclick="openGame()">▶ Play Game</button>

  <!-- Game Overlay Container -->
  <div id="gameModal" class="game-modal">
    <button class="close-btn" onclick="closeGame()">✕ Close Game</button>
    <div class="iframe-wrapper">
      <iframe id="gameIframe" src="" title="Toad Runner Game"></iframe>
    </div>
  </div>

  <script>
    // Apni Game HTML File Ka Naam/Path Yahan Likhein
    const gameFilePath = 'toad-runner.html';

    function openGame() {
      const modal = document.getElementById('gameModal');
      const iframe = document.getElementById('gameIframe');
      iframe.src = gameFilePath;
      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('gameModal');
      const iframe = document.getElementById('gameIframe');
      modal.style.display = 'none';
      iframe.src = ''; // Close karne par game stop ho jayegi
    }
  </script>

</body>
</html>
