<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca Hunting - LethalOrca 3D Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #03080e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-card, .speed-card {
            background: rgba(4, 21, 31, 0.75);
            border: 1px solid rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-label {
            font-size: 11px;
            color: #00f2fe;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .hud-value {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* Screen overlays */
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(3, 12, 20, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.4);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            pointer-events: auto;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
        }

        .screen h1 {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .screen p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #03080e;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            letter-spacing: 1px;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.7);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        #game-over-screen {
            display: none;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="hud-top">
            <div class="score-card">
                <div class="hud-label">$LORCA COLLECTED</div>
                <div class="hud-value" id="score">0</div>
            </div>
            <div class="speed-card">
                <div class="hud-label">SPEED</div>
                <div class="hud-value" id="speed-val">x1.0</div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="screen" id="start-screen">
        <h1>ORCA HUNTING</h1>
        <p>Hunt $LORCA coins, jump over dangerous reefs, and navigate the deep ocean!</p>
        <button class="btn" id="start-btn">▶ START HUNT</button>
        <div class="controls-hint">TAP / SPACE / UP ARROW TO JUMP</div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen" id="game-over-screen">
        <h1>HUNT OVER</h1>
        <p>You crashed into the ocean reef!</p>
        <p style="font-size: 18px; color: #fff; margin-bottom: 20px;">Total Collected: <strong id="final-score" style="color: #00f2fe;">0</strong> $LORCA</p>
        <button class="btn" id="restart-btn">🔄 TRY AGAIN</button>
    </div>

    <script>
        // Web Audio API for Music & SFX
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // Sound Generators
        function playCoinSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playCrashSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // Deep Sea Background Music Loop Synthesizer
        let bgmInterval;
        function startBGM() {
            if (!audioCtx) return;
            let step = 0;
            const notes = [110, 110, 130, 98, 110, 146, 130, 98]; 
            bgmInterval = setInterval(() => {
                if (audioCtx.state === 'running') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[step % notes.length];
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    step++;
                }
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
        }

        // --- THREE.JS GAME SETUP ---
        let scene, camera, renderer, orca, obstacles = [], coins = [];
        let isPlaying = false, score = 0, speed = 0.25;
        let isJumping = false, jumpVelocity = 0, gravity = -0.012;
        const ORCA_BASE_Y = -1;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x030d1a);
            scene.fog = new THREE.FogExp2(0x030d1a, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f2fe, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Create Orca
            createOrca();

            // Create Seabed
            createSeabed();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') triggerJump();
            });
            window.addEventListener('touchstart', triggerJump);

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
        }

        function createOrca() {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.ConeGeometry(0.7, 2.2, 16);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 80 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.z = -Math.PI / 2;
            group.add(body);

            // Belly
            const bellyGeo = new THREE.ConeGeometry(0.5, 1.8, 16);
            const bellyMat = new THREE.MeshPhongMaterial({ color: 0xeeeeee });
            const belly = new THREE.Mesh(bellyGeo, bellyMat);
            belly.rotation.z = -Math.PI / 2;
            belly.position.y = -0.15;
            group.add(belly);

            // Fin
            const finGeo = new THREE.ConeGeometry(0.2, 0.8, 8);
            const finMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const fin = new THREE.Mesh(finGeo, finMat);
            fin.position.set(-0.2, 0.6, 0);
            fin.rotation.z = -Math.PI / 4;
            group.add(fin);

            group.position.set(-3, ORCA_BASE_Y, 0);
            orca = group;
            scene.add(orca);
        }

        function createSeabed() {
            const geo = new THREE.PlaneGeometry(200, 20);
            const mat = new THREE.MeshPhongMaterial({ color: 0x051b2c, roughness: 0.9 });
            const seabed = new THREE.Mesh(geo, mat);
            seabed.rotation.x = -Math.PI / 2;
            seabed.position.y = -2;
            scene.add(seabed);
        }

        function spawnObstacle() {
            const height = 1 + Math.random() * 1.2;
            const geo = new THREE.ConeGeometry(0.6, height, 6);
            const mat = new THREE.MeshPhongMaterial({ color: 0x1a364a, flatShading: true });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set(20, -2 + height / 2, 0);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCoin() {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const mat = new THREE.MeshPhongMaterial({ color: 0xffd700, metalness: 0.8, shininess: 100 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            const yPos = Math.random() > 0.5 ? ORCA_BASE_Y + 1.5 : ORCA_BASE_Y;
            coin.position.set(20, yPos, 0);
            scene.add(coin);
            coins.push(coin);
        }

        function triggerJump() {
            if (!isPlaying) return;
            if (!isJumping) {
                isJumping = true;
                jumpVelocity = 0.22;
                playJumpSound();
            }
        }

        function startGame() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Reset variables
            score = 0;
            speed = 0.25;
            document.getElementById('score').innerText = score;
            document.getElementById('speed-val').innerText = 'x1.0';

            // Clear entities
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            orca.position.y = ORCA_BASE_Y;
            isJumping = false;
            isPlaying = true;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';

            stopBGM();
            startBGM();
        }

        function gameOver() {
            isPlaying = false;
            stopBGM();
            playCrashSound();
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'block';
        }

        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                frameCount++;
                speed += 0.00005; 
                document.getElementById('speed-val').innerText = 'x' + (speed / 0.25).toFixed(1);

                // Jump logic
                if (isJumping) {
                    orca.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    orca.rotation.z = jumpVelocity * 2;
                    if (orca.position.y <= ORCA_BASE_Y) {
                        orca.position.y = ORCA_BASE_Y;
                        isJumping = false;
                        orca.rotation.z = 0;
                    }
                }

                // Spawn obstacles & coins
                if (frameCount % Math.floor(120 / (speed * 2)) === 0) {
                    if (Math.random() > 0.4) spawnObstacle();
                    else spawnCoin();
                }

                // Move obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.x -= speed;

                    // Collision check
                    if (Math.abs(obs.position.x - orca.position.x) < 0.8 && Math.abs(obs.position.y - orca.position.y) < 1.0) {
                        gameOver();
                    }

                    if (obs.position.x < -10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Move coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    let coin = coins[i];
                    coin.position.x -= speed;
                    coin.rotation.z += 0.05;

                    // Collection check
                    if (Math.abs(coin.position.x - orca.position.x) < 0.8 && Math.abs(coin.position.y - orca.position.y) < 0.8) {
                        score += 100;
                        document.getElementById('score').innerText = score;
                        playCoinSound();
                        scene.remove(coin);
                        coins.splice(i, 1);
                    } else if (coin.position.x < -10) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
