<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LethalOrca Runner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#020b14; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #gameCanvas { display:block; width:100%; height:100%; }

  #hud {
    position:fixed; top:0; left:0; width:100%; padding:14px 18px;
    display:flex; gap:12px; justify-content:flex-start; align-items:flex-start;
    pointer-events:none; z-index:12;
  }
  .hud-box {
    background:rgba(4,18,30,0.55); border:1px solid rgba(45,212,191,0.35);
    backdrop-filter: blur(6px); border-radius:12px; padding:8px 12px;
    box-shadow:0 0 18px rgba(45,212,191,0.12); pointer-events:auto;
  }
  #score { color:#f5c451; font-size:20px; font-weight:700; letter-spacing:0.5px; text-shadow:0 0 10px rgba(245,196,81,0.5); }
  #scoreLabel { color:#7fe3d4; font-size:10px; letter-spacing:2px; text-transform:uppercase; }
  #speedTag { color:#7fe3d4; font-size:12px; letter-spacing:1px; text-align:right; }

  #centerMsg {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:20; color:#eafffb;
  }
  #centerMsg h1 {
    font-size:38px; color:#f5c451; text-shadow:0 0 22px rgba(245,196,81,0.6);
    letter-spacing:1px; margin-bottom:6px;
  }
  #centerMsg p { color:#9fd8cf; font-size:14px; margin-bottom:18px; letter-spacing:0.5px; }
  #centerMsg .sub { color:#6fa89c; font-size:12px; }
  button.playBtn {
    background:linear-gradient(135deg,#0f766e,#134e4a); color:#f5c451;
    border:1px solid #f5c451; padding:12px 30px; font-size:15px; letter-spacing:1px;
    border-radius:30px; cursor:pointer; box-shadow:0 0 20px rgba(245,196,81,0.25);
    transition:transform .15s ease; pointer-events:auto;
  }
  button.playBtn:active { transform:scale(0.95); }

  /* New Game Trigger Button Style */
  .index-game-btn {
    display: inline-block;
    background: linear-gradient(135deg, #f5c451, #d99b26);
    color: #020b14;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(245,196,81,0.4);
    text-decoration: none;
    margin-bottom: 8px; pointer-events:auto;
  }

  #tapHint {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    color:#7fe3d4; font-size:12px; letter-spacing:1.5px; opacity:0.75; z-index:10;
    pointer-events:none;
  }

  /* HUD controls on the right */
  #hud-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .small-btn { background:transparent; border:1px solid rgba(127,227,212,0.08); color:#7fe3d4; font-size:12px; padding:6px 8px; border-radius:8px; cursor:pointer; pointer-events:auto; }

  /* Touch jump button */
  #touchJumpBtn {
    position:fixed; right:18px; bottom:18px; z-index:18; pointer-events:auto;
    background:linear-gradient(135deg,#0f766e,#134e4a); color:#f5c451; border:none; padding:14px 18px; border-radius:50px; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    font-weight:700; font-size:16px;
  }

  /* Pause overlay smaller */
  .overlay-note { font-size:13px; color:#9fd8cf; }

  @media (max-width:520px){
    #centerMsg h1 { font-size:28px; }
    .hud-box { padding:8px 10px; }
    #touchJumpBtn { padding:12px 14px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div id="scoreLabel">LORCA COLLECTED</div>
    <div id="score">0</div>
  </div>

  <div class="hud-box">
    <div id="speedTag">SPEED x1.0</div>
  </div>

  <div id="hud-right">
    <div class="hud-box">
      <div class="overlay-note">HIGHSCORE</div>
      <div id="highscore" style="color:#f5c451; font-weight:700">0</div>
    </div>
    <div class="hud-box" style="display:flex; gap:8px; align-items:center;">
      <button id="pauseBtn" class="small-btn">Pause</button>
      <button id="fsBtn" class="small-btn">Fullscreen</button>
    </div>
  </div>
</div>

<div id="tapHint">TAP / SPACE / ↑ TO JUMP</div>

<div id="centerMsg">
  <h1>LETHAL ORCA</h1>
  <p>Jump the reef. Catch the coins. Swim to the right.</p>
  
  <!-- Index Page Main Action Button -->
  <div>
    <button class="index-game-btn" id="mainGameLauncherBtn">🎮 PLAY LETHAL ORCA RUNNER</button>
  </div>

  <button class="playBtn" id="startBtn">▶ START SWIM</button>
  <div class="sub" style="margin-top:12px;">Each coin = 100 $LORCA</div>
</div>

<canvas id="gameCanvas"></canvas>

<button id="touchJumpBtn" style="display:none">JUMP</button>

<script>
// ---------------------------------------------------------------
// SCENE SETUP — SIDE-VIEW RUNNER
// Improvements added: highscore (localStorage), simple sounds (WebAudio), pause/fullscreen, touch jump button
// ---------------------------------------------------------------
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03121f, 0.02);
scene.background = new THREE.Color(0x03121f);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 3.4, 13);
camera.lookAt(0, 1.6, 0);

// Lighting
const ambient = new THREE.AmbientLight(0x2a4a55, 0.9);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xbfe9ff, 0.9);
sun.position.set(5, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const goldRim = new THREE.PointLight(0xf5c451, 1.2, 30);
goldRim.position.set(-6, 4, 4);
scene.add(goldRim);

const tealRim = new THREE.PointLight(0x2dd4bf, 1.0, 30);
tealRim.position.set(6, 2, 4);
scene.add(tealRim);

// OCEAN FLOOR
const waterGeo = new THREE.PlaneGeometry(220, 40, 140, 30);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x0a4a52, shininess: 90, specular: 0x2dd4bf,
  transparent:true, opacity:0.92, side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = 0;
water.receiveShadow = true;
scene.add(water);
const waterPosAttr = waterGeo.attributes.position;
const waterBase = Float32Array.from(waterPosAttr.array);

// Deep abyss backdrop
const abyssGeo = new THREE.PlaneGeometry(80, 40);
const abyssMat = new THREE.MeshBasicMaterial({ color:0x010509 });
const abyss = new THREE.Mesh(abyssGeo, abyssMat);
abyss.position.set(0, 5, -30);
scene.add(abyss);

// ORCA BUILD
function buildOrca() {
  const group = new THREE.Group();

  const blackMat = new THREE.MeshStandardMaterial({ color:0x0b0f14, roughness:0.35, metalness:0.25 });
  const whiteMat = new THREE.MeshStandardMaterial({ color:0xeaf6f6, roughness:0.4, metalness:0.1 });

  const bodyGeo = new THREE.SphereGeometry(0.62, 32, 24);
  bodyGeo.scale(1, 0.82, 1.9);
  const body = new THREE.Mesh(bodyGeo, blackMat);
  body.position.set(0, 0.55, 0);
  body.castShadow = true;
  group.add(body);

  const bellyGeo = new THREE.SphereGeometry(0.5, 24, 16);
  bellyGeo.scale(0.85, 0.55, 1.5);
  const belly = new THREE.Mesh(bellyGeo, whiteMat);
  belly.position.set(0, 0.28, 0.05);
  group.add(belly);

  const patchGeo = new THREE.SphereGeometry(0.13, 16, 12);
  patchGeo.scale(1, 0.6, 0.5);
  const patchL = new THREE.Mesh(patchGeo, whiteMat);
  patchL.position.set(0.32, 0.78, 0.95);
  patchL.rotation.y = 0.4;
  group.add(patchL);
  const patchR = patchL.clone();
  patchR.position.x = -0.32;
  patchR.rotation.y = -0.4;
  group.add(patchR);

  const snoutGeo = new THREE.SphereGeometry(0.38, 20, 16);
  snoutGeo.scale(0.8, 0.75, 1.1);
  const snout = new THREE.Mesh(snoutGeo, blackMat);
  snout.position.set(0, 0.55, 1.55);
  snout.castShadow = true;
  group.add(snout);

  const finGeo = new THREE.ConeGeometry(0.28, 0.85, 4);
  finGeo.scale(0.35, 1, 1);
  const dorsalFin = new THREE.Mesh(finGeo, blackMat);
  dorsalFin.position.set(0, 1.15, -0.05);
  dorsalFin.rotation.z = -0.15;
  dorsalFin.castShadow = true;
  group.add(dorsalFin);

  const saddleGeo = new THREE.SphereGeometry(0.32, 16, 12);
  saddleGeo.scale(1, 0.4, 0.7);
  const saddleMat = new THREE.MeshStandardMaterial({ color:0x4a5a5f, roughness:0.5 });
  const saddle = new THREE.Mesh(saddleGeo, saddleMat);
  saddle.position.set(0, 0.95, -0.55);
  group.add(saddle);

  const pecGeo = new THREE.SphereGeometry(0.22, 16, 12);
  pecGeo.scale(1.6, 0.28, 0.7);
  const pecL = new THREE.Mesh(pecGeo, blackMat);
  pecL.position.set(0.55, 0.35, 0.5);
  pecL.rotation.z = 0.5;
  group.add(pecL);
  const pecR = pecL.clone();
  pecR.position.x = -0.55;
  pecR.rotation.z = -0.5;
  group.add(pecR);

  const tailStockGeo = new THREE.CylinderGeometry(0.16, 0.06, 0.65, 12);
  const tailStock = new THREE.Mesh(tailStockGeo, blackMat);
  tailStock.position.set(0, 0.5, -1.35);
  tailStock.rotation.x = Math.PI/2 * 0.15;
  group.add(tailStock);

  const flukeGeo = new THREE.SphereGeometry(0.4, 16, 8);
  flukeGeo.scale(2.2, 0.15, 0.6);
  const fluke = new THREE.Mesh(flukeGeo, blackMat);
  fluke.position.set(0, 0.42, -1.75);
  fluke.castShadow = true;
  group.add(fluke);

  const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
  const eyeMatBlk = new THREE.MeshStandardMaterial({ color:0x000000, roughness:0.1 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMatBlk);
  eyeL.position.set(0.34, 0.8, 1.05);
  group.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.x = -0.34;
  group.add(eyeR);

  group.userData.parts = { body, dorsalFin, fluke, pecL, pecR };
  group.scale.set(0.85,0.85,0.85);

  group.rotation.y = Math.PI/2;

  return group;
}

const orca = buildOrca();
scene.add(orca);

const ORCA_X = -4.2;
const groundY = 0.15;
let velocityY = 0;
let isJumping = false;
const GRAVITY = -0.028;
const JUMP_FORCE = 0.46;
orca.position.set(ORCA_X, groundY, 0);

// OBSTACLES + COINS
const SPAWN_X = 15;
const DESPAWN_X = -9;

const obstacles = [];
const coins = [];
const obstacleMat = new THREE.MeshStandardMaterial({ color:0x2b3a3f, roughness:0.8, metalness:0.1, flatShading:true });
const coinMat = new THREE.MeshStandardMaterial({ color:0xf5c451, roughness:0.25, metalness:0.8, emissive:0x4a2f00, emissiveIntensity:0.4 });

function makeReef() {
  const g = new THREE.Group();
  const rocks = 3 + Math.floor(Math.random()*3);
  for (let i=0;i<rocks;i++){
    const s = 0.35 + Math.random()*0.4;
    const geo = new THREE.DodecahedronGeometry(s, 0);
    const m = new THREE.Mesh(geo, obstacleMat);
    m.position.set((Math.random()-0.5)*0.5, s*0.6, (Math.random()-0.5)*0.6);
    m.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    m.castShadow = true;
    g.add(m);
  }
  g.userData.height = 0.9;
  g.userData.radius = 0.75;
  return g;
}

function makeCoin() {
  const geo = new THREE.TorusGeometry(0.32, 0.11, 12, 24);
  const m = new THREE.Mesh(geo, coinMat);
  m.rotation.x = Math.PI/2;
  m.castShadow = true;
  return m;
}

// GAME STATE
let running = false;
let gameOver = false;
let score = 0;
let baseSpeed = 0.16;
let speed = baseSpeed;
let spawnTimer = 0;
let lastSpeedBump = 0;
let paused = false;
const speedTag = document.getElementById('speedTag');
const scoreEl = document.getElementById('score');
const centerMsg = document.getElementById('centerMsg');
const startBtn = document.getElementById('startBtn');
const mainGameLauncherBtn = document.getElementById('mainGameLauncherBtn');
const highscoreEl = document.getElementById('highscore');
const pauseBtn = document.getElementById('pauseBtn');
const fsBtn = document.getElementById('fsBtn');
const touchJumpBtn = document.getElementById('touchJumpBtn');

// Highscore via localStorage
const HS_KEY = 'lethalOrca_highscore';
function loadHighscore(){
  const v = parseInt(localStorage.getItem(HS_KEY));
  return isNaN(v)?0:v;
}
function saveHighscore(v){
  localStorage.setItem(HS_KEY, String(v));
}
let highscore = loadHighscore();
highscoreEl.textContent = highscore;

// Simple WebAudio sounds (no external files)
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
  }
}
function playTone(freq, type='sine', time=0.08, gain=0.12){
  ensureAudio();
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = 0;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(gain, now+0.005);
  o.start(now);
  g.gain.exponentialRampToValueAtTime(0.0001, now+time);
  o.stop(now+time+0.02);
}
function playSound(kind){
  if (kind==='jump') playTone(520, 'sine', 0.08, 0.08);
  else if (kind==='coin') { playTone(840, 'sawtooth', 0.12, 0.14); playTone(620,'sine',0.12,0.08); }
  else if (kind==='crash') { playTone(120,'sine',0.25,0.25); playTone(220,'sawtooth',0.16,0.18); }
}

function resetGame() {
  obstacles.forEach(o=>scene.remove(o.mesh));
  coins.forEach(c=>scene.remove(c.mesh));
  obstacles.length = 0;
  coins.length = 0;
  score = 0;
  speed = baseSpeed;
  spawnTimer = 0;
  lastSpeedBump = 0;
  velocityY = 0;
  isJumping = false;
  orca.position.set(ORCA_X, groundY, 0);
  orca.rotation.z = 0;
  scoreEl.textContent = '0';
  speedTag.textContent = 'SPEED x1.0';
  gameOver = false;
}

function spawnObstacle() {
  const reef = makeReef();
  reef.position.set(SPAWN_X, 0, (Math.random()-0.5)*0.6);
  scene.add(reef);
  obstacles.push({ mesh: reef, radius: reef.userData.radius });
}

function spawnCoin() {
  const coin = makeCoin();
  coin.position.set(SPAWN_X, 0.9 + Math.random()*0.7, (Math.random()-0.5)*0.6);
  scene.add(coin);
  coins.push({ mesh: coin, taken:false });
}

function jump() {
  if (!running || gameOver || paused) return;
  if (!isJumping) {
    isJumping = true;
    velocityY = JUMP_FORCE;
    playSound('jump');
  }
}

function startGame() {
  resetGame();
  running = true;
  paused = false;
  centerMsg.style.display = 'none';
  touchJumpBtn.style.display = 'block';
}

function endGame() {
  running = false;
  gameOver = true;
  playSound('crash');
  // update highscore
  if (score > highscore) { highscore = score; saveHighscore(highscore); }
  highscoreEl.textContent = highscore;

  centerMsg.style.display = 'block';
  centerMsg.innerHTML = `
    <h1>ORCA DOWN</h1>
    <p>You collected <span style="color:#f5c451">${score}</span> $LORCA</p>
    <button class="playBtn" id="startBtn2">↻ SWIM AGAIN</button>
    <div class="sub" style="margin-top:12px;">Reef strike — try again</div>
  `;
  document.getElementById('startBtn2').addEventListener('click', startGame);
  touchJumpBtn.style.display = 'none';
}

startBtn.addEventListener('click', startGame);
mainGameLauncherBtn.addEventListener('click', startGame);

pauseBtn.addEventListener('click', togglePause);
fsBtn.addEventListener('click', toggleFullscreen);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  if (e.code === 'KeyP') { togglePause(); }
});

// touch/mouse
window.addEventListener('touchstart', (e)=>{ 
  // if touching a control, ignore
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'BUTTON' || e.target.id === 'pauseBtn' || e.target.id === 'fsBtn' ) return;
  jump();
});
window.addEventListener('mousedown', (e)=>{ if(e.target.tagName!=='BUTTON') jump(); });

touchJumpBtn.addEventListener('click', jump);

function togglePause(){
  if (!running || gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  if (paused) {
    centerMsg.style.display = 'block';
    centerMsg.innerHTML = `<h1>PAUSED</h1><p class="overlay-note">Press P or Resume to continue</p><button class="playBtn" id="resumeBtn">▶ RESUME</button>`;
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
  } else {
    centerMsg.style.display = 'none';
  }
}

function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
    fsBtn.textContent = 'Exit FS';
  } else {
    document.exitFullscreen?.();
    fsBtn.textContent = 'Fullscreen';
  }
}

window.addEventListener('fullscreenchange', ()=>{
  if (!document.fullscreenElement) fsBtn.textContent = 'Fullscreen';
});

window.addEventListener('visibilitychange', ()=>{
  // auto-pause when tab hidden
  if (document.hidden && running && !gameOver && !paused) {
    togglePause();
  }
});

function distXZ(a, b) {
  const dx = a.x - b.x, dz = a.z - b.z;
  return Math.sqrt(dx*dx + dz*dz);
}

// ANIMATE
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (let i=0;i<waterPosAttr.count;i++){
    const ix = i*3;
    const x = waterBase[ix], y = waterBase[ix+1];
    waterPosAttr.array[ix+2] = Math.sin((x*0.15) + t*1.6) * 0.12 + Math.cos((y*0.3)+t*1.1)*0.08;
  }
  waterPosAttr.needsUpdate = true;

  const parts = orca.userData.parts;
  parts.fluke.rotation.y = Math.sin(t*9) * 0.35;
  parts.pecL.rotation.y = Math.sin(t*4) * 0.15;
  parts.pecR.rotation.y = -Math.sin(t*4) * 0.15;
  parts.dorsalFin.rotation.z = -0.15 + Math.sin(t*9)*0.03;

  if (running && !gameOver && !paused) {
    spawnTimer -= dt;

    if (t - lastSpeedBump > 8) {
      lastSpeedBump = t;
      speed = Math.min(speed * 1.14, baseSpeed*3.2);
      speedTag.textContent = 'SPEED x' + (speed/baseSpeed).toFixed(1);
    }

    if (spawnTimer <= 0) {
      spawnTimer = 1.15 - Math.min(speed*1.5, 0.7);
      if (Math.random() < 0.65) spawnObstacle();
      if (Math.random() < 0.75) spawnCoin();
    }

    if (isJumping) {
      orca.position.y += velocityY;
      velocityY += GRAVITY;
      if (orca.position.y <= groundY) {
        orca.position.y = groundY;
        isJumping = false;
        velocityY = 0;
      }
    }
    orca.rotation.z = isJumping ? velocityY*0.5 : Math.sin(t*3)*0.02;
    orca.position.z = Math.sin(t*1.3) * 0.05;

    for (let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.mesh.position.x -= speed;
      if (o.mesh.position.x < DESPAWN_X) {
        scene.remove(o.mesh);
        obstacles.splice(i,1);
        continue;
      }
      const oy = 0.9;
      const closeEnough = distXZ(orca.position, o.mesh.position) < (o.radius + 0.45);
      const lowEnough = orca.position.y < oy;
      if (closeEnough && lowEnough) {
        endGame();
      }
    }

    for (let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      c.mesh.position.x -= speed;
      c.mesh.rotation.z += 0.12;
      if (c.mesh.position.x < DESPAWN_X) {
        scene.remove(c.mesh);
        coins.splice(i,1);
        continue;
      }
      if (!c.taken) {
        const dx = Math.abs(c.mesh.position.x - orca.position.x);
        const dy = Math.abs(c.mesh.position.y - (orca.position.y+0.6));
        const dz = Math.abs(c.mesh.position.z - orca.position.z);
        if (dx < 0.6 && dy < 0.7 && dz < 0.6) {
          c.taken = true;
          score += 100;
          scoreEl.textContent = score;
          playSound('coin');
          scene.remove(c.mesh);
          coins.splice(i,1);
        }
      }
    }
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// show touch jump on small screens
function updateTouchVisibility(){
  if ('ontouchstart' in window || navigator.maxTouchPoints>0) {
    touchJumpBtn.style.display = running && !gameOver ? 'block' : (running? 'block':'none');
  } else touchJumpBtn.style.display = 'none';
}
window.addEventListener('load', updateTouchVisibility);
window.addEventListener('resize', updateTouchVisibility);

// initialize audio on user gesture
['click','touchstart','keydown'].forEach(ev=>window.addEventListener(ev, ()=>ensureAudio(), {once:true}));

</script>
</body>
</html>
