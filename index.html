<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LethalOrca — $LORCA & Airdrop</title>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cloudflare Turnstile CDN -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --abyss: #020910;
      --deep: #05121e;
      --deep2: #081a2b;
      --teal: #2dd4bf;
      --teal-glow: #5eead4;
      --gold: #f2c94c;
      --ink: #f4fcfc;
      --muted: #8ab4b4;
      --line: rgba(94, 234, 212, 0.15);
      --display: 'Space Grotesk', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--abyss);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .claim-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--teal-glow), #0072ff);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 25px rgba(45, 212, 191, 0.4);
      font-size: 16px;
    }

    /* --- AIRDROP MODAL STYLES --- */
    .airdrop-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 9, 16, 0.85);
      backdrop-filter: blur(10px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .airdrop-modal-overlay.active {
      display: flex;
    }

    .airdrop-modal-box {
      background: linear-gradient(180deg, var(--deep2), var(--deep));
      border: 1px solid var(--line);
      padding: 30px;
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close-modal-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }
    .close-modal-btn:hover { color: #ff5555; }

    .airdrop-modal-box h3 {
      font-family: var(--display);
      font-size: 22px;
      color: var(--teal-glow);
      margin-top: 0;
      margin-bottom: 8px;
    }

    .airdrop-modal-box p {
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      text-align: left;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      font-family: var(--mono);
      text-transform: uppercase;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      font-family: var(--mono);
    }
    .modal-input:focus { border-color: var(--teal-glow); }

    /* Turnstile Widget Container */
    #turnstileContainer {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--teal-glow), #0072ff);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    #airdropStatusMsg {
      margin-top: 14px;
      font-size: 13px;
      font-family: var(--mono);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Open Modal Button -->
  <button class="claim-btn" onclick="openAirdropModal()">Claim Airdrop</button>

  <!-- AIRDROP POPUP MODAL -->
  <div id="airdropModal" class="airdrop-modal-overlay">
    <div class="airdrop-modal-box">
      <button class="close-modal-btn" onclick="closeAirdropModal()">✕</button>
      
      <h3>🌊 $LORCA Airdrop</h3>
      <p>Submit your Solana wallet address and Twitter profile to register for the airdrop.</p>

      <label class="field-label" for="solAddress">Solana Wallet Address</label>
      <input type="text" id="solAddress" class="modal-input" placeholder="Enter Solana Wallet Address..." />

      <label class="field-label" for="xHandle">X / Twitter Profile Link</label>
      <input type="text" id="xHandle" class="modal-input" placeholder="https://x.com/yourusername" />

      <!-- Cloudflare Turnstile Render Area -->
      <div id="turnstileContainer"></div>

      <button class="btn-submit" id="submitAirdropBtn">Submit Address</button>
      <p id="airdropStatusMsg"></p>
    </div>
  </div>

  <script>
    // --- Supabase Setup ---
    const SUPABASE_URL = 'https://obzyiecwhfdanzjtuhiq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ienlpZWN3aGZkYW56anR1aGlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA5MjYsImV4cCI62E0MTAwNjkyNn0.gYPNd5oH9hPaTLWoJkDDx-eTfkm_AXIjsj-ycHowpuc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let turnstileWidgetId = null;

    // Turnstile Widget Render / Reset Logic
    function renderTurnstile() {
      if (window.turnstile && document.getElementById('turnstileContainer')) {
        if (turnstileWidgetId !== null) {
          turnstile.reset(turnstileWidgetId);
        } else {
          turnstileWidgetId = turnstile.render('#turnstileContainer', {
            // Cloudflare Always-Pass Test Key (No Invalid Key Error)
            sitekey: '1x00000000000000000000AA', 
            theme: 'dark'
          });
        }
      }
    }

    // Modal Control
    function openAirdropModal() {
      const modal = document.getElementById('airdropModal');
      if (modal) {
        modal.classList.add('active');
        renderTurnstile(); // Loads Captcha
      }
    }

    function closeAirdropModal() {
      const modal = document.getElementById('airdropModal');
      if (modal) {
        modal.classList.remove('active');
      }
    }

    // Form Submit Handler
    document.getElementById('submitAirdropBtn').addEventListener('click', async () => {
      const address = document.getElementById('solAddress').value.trim();
      const xHandle = document.getElementById('xHandle').value.trim();
      const statusMsg = document.getElementById('airdropStatusMsg');
      const submitBtn = document.getElementById('submitAirdropBtn');

      // 1. Verify Cloudflare Turnstile
      const turnstileToken = turnstile.getResponse(turnstileWidgetId);
      if (!turnstileToken) {
        statusMsg.innerText = "❌ Please complete Turnstile verification!";
        statusMsg.style.color = "#ff4d4d";
        return;
      }

      // 2. Validate Solana Address format
      const isSolanaAddress = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address);
      if (!isSolanaAddress) {
        statusMsg.innerText = "❌ Enter a valid Solana wallet address!";
        statusMsg.style.color = "#ff4d4d";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.innerText = "";

      try {
        const { data, error } = await supabaseClient
          .from('airdrop_submissions')
          .insert([{ wallet_address: address, x_profile: xHandle || null }]);

        if (error) {
          if (error.code === '23505' || error.status === 409) {
            statusMsg.innerText = "⚠️ This wallet address is already registered!";
            statusMsg.style.color = "#ffa500";
          } else {
            statusMsg.innerText = "❌ Error: " + error.message;
            statusMsg.style.color = "#ff4d4d";
          }
        } else {
          statusMsg.innerText = "✅ Success! Your address has been recorded.";
          statusMsg.style.color = "#5eead4";
          document.getElementById('solAddress').value = "";
          document.getElementById('xHandle').value = "";
          turnstile.reset(turnstileWidgetId);
        }
      } catch (err) {
        console.error("Submission Error:", err);
        statusMsg.innerText = "❌ Something went wrong!";
        statusMsg.style.color = "#ff4d4d";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Address";
      }
    });

    // Close on overlay click
    window.onclick = function(e) {
      const modal = document.getElementById('airdropModal');
      if (e.target === modal) {
        closeAirdropModal();
      }
    };
  </script>
</body>
</html>
