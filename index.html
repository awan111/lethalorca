<!-- Code Section Container -->
<div style="background: var(--deep); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 20px 0;">
  
  <!-- First Code Block -->
  <label style="color: var(--teal-glow); font-family: var(--mono); font-size: 14px;">First Code Embed:</label>
  <pre style="background: var(--abyss); color: var(--ink); padding: 12px; border-radius: 8px; font-family: var(--mono); overflow-x: auto; border: 1px solid var(--line);"><code>// Enter your first code snippet here</code></pre>

  <!-- Second Code Block -->
  <label style="color: var(--teal-glow); font-family: var(--mono); font-size: 14px; margin-top: 15px; display: block;">Second Code Embed:</label>
  <pre style="background: var(--abyss); color: var(--ink); padding: 12px; border-radius: 8px; font-family: var(--mono); overflow-x: auto; border: 1px solid var(--line);"><code>// Enter your second code snippet here</code></pre>

  <!-- Action Button -->
  <div style="margin-top: 15px;">
    <button class="btn btn-primary" onclick="alert('Button clicked!')">Action Button</button>
  </div>

</div>
