<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Lethal Orca | Official Airdrop & Community</title>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-text-size-adjust: 100%; /* Prevents iOS text auto-scaling bug */
        }
        .container {
            background: #131c2e;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .ca-box {
            background: #0b0f19;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px dashed #334155;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: #fff;
            font-size: 16px; /* 16px prevents iOS Safari from auto-zooming on focus */
            margin-bottom: 15px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="text"]:focus {
            border-color: #00d2ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
            -webkit-appearance: none;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #statusMsg {
            margin-top: 15px;
            font-size: 14px;
        }
        .socials {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .socials a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .socials a:hover {
            color: #00d2ff;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌊 Lethal Orca Airdrop</h1>
        <p>Drop your Solana wallet address below to participate in the official $LCr airdrop event!</p>
        
        <div class="ca-box">
            <strong>CA:</strong> 7RqpgT532tsYakbgnTXECC4MHTE
        </div>

        <input type="text" id="solAddress" placeholder="Enter your Solana Wallet Address..." />
        <button id="submitBtn">Submit Address</button>
        
        <p id="statusMsg"></p>

        <div class="socials">
            <a href="https://t.me/Lethal_Orca" target="_blank">Telegram</a>
            <a href="https://discord.gg/bXkMYsThv" target="_blank">Discord</a>
            <a href="https://x.com/lethalorcatdo" target="_blank">Twitter / X</a>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://obzyiecwhfdanzjtuhiq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ienlpZWN3aGZkYW56anR1aGlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MzA5MjYsImV4cCI6MjEwMTAwNjkyNn0.gYPNd5oH9hPaTLWoJkDDx-eTfkm_AXIjsj-ycHowpuc';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Telegram Configuration
        const TELEGRAM_BOT_TOKEN = '8689687590:AAHSzJ_36tERZZzo4LhSMIavF30lUZI18wE';
        const TELEGRAM_CHAT_ID = '7586392121';

        async function sendTelegramAlert(wallet) {
            const message = `🚨 New Airdrop Submission!\n\nWallet: \`${wallet}\``;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                console.log("Telegram API Response:", result);
            } catch (err) {
                console.error("Telegram fetch error caught:", err);
            }
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const address = document.getElementById('solAddress').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            // Solana address validation check (32 to 44 characters)
            if(address.length < 32 || address.length > 44) {
                statusMsg.innerText = "❌ Please enter a valid Solana address!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.innerText = "";
            
            try {
                const { data, error } = await supabaseClient
                    .from('airdrop_submissions')
                    .insert([{ wallet_address: address }]);

                // Send Telegram notification
                await sendTelegramAlert(address);

                if (error) {
                    if (error.code === '23505' || error.status === 409) {
                        statusMsg.innerText = "⚠️ This wallet address is already registered!";
                        statusMsg.style.color = "#ffa500";
                    } else {
                        statusMsg.innerText = "❌ Error: " + error.message;
                        statusMsg.style.color = "#ff4d4d";
                    }
                } else {
                    statusMsg.innerText = "✅ Success! Your address has been recorded.";
                    statusMsg.style.color = "#4bb543";
                    document.getElementById('solAddress').value = "";
                }
            } catch (err) {
                console.error("Main Catch Error:", err);
                statusMsg.innerText = "❌ Something went wrong!";
                statusMsg.style.color = "#ff4d4d";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Address";
            }
        });
    </script>

</body>
</html>
