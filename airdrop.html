<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca ($LORCA) | Deep Sea Solana Token</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Turnstile Explicit Render API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }

        .glow-box {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
        }

        .glow-box-hover:hover {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.3);
        }

        .modal-blur {
            backdrop-filter: blur(8px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        /* Modal Visibility Animations */
        .modal {
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .modal-active {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative selection:bg-cyan-500 selection:text-black">

    <!-- Background Ocean Grid FX -->
    <div class="fixed inset-0 bg-[linear-gradient(to_right,#1f293710_1px,transparent_1px),linear-gradient(to_bottom,#1f293710_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none z-0"></div>

    <!-- Header Navigation -->
    <header class="w-full p-5 flex justify-between items-center border-b border-cyan-900/30 bg-slate-950/80 backdrop-blur-md fixed top-0 z-40">
        <div class="flex items-center gap-3">
            <span class="font-orbitron text-2xl font-black tracking-wider text-cyan-400 glow-text">LETHAL<span class="text-white">ORCA</span></span>
        </div>
        <nav class="hidden md:flex gap-6 text-sm font-semibold text-slate-300">
            <a href="#about" class="hover:text-cyan-400 transition">About</a>
            <a href="#tokenomics" class="hover:text-cyan-400 transition">Tokenomics</a>
            <a href="javascript:void(0)" onclick="openAirdropModal()" class="hover:text-cyan-400 transition text-cyan-400">Airdrop</a>
        </nav>
        <button onclick="openAirdropModal()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-5 py-2 rounded-full shadow-lg shadow-cyan-500/20 transition transform hover:scale-105">
            Join Airdrop
        </button>
    </header>

    <!-- Main Content / Hero -->
    <main class="pt-36 pb-20 px-4 text-center max-w-4xl mx-auto flex-1 flex flex-col justify-center items-center z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-cyan-950/30 text-cyan-400 text-xs font-semibold mb-6">
            <span class="flex h-2 w-2 rounded-full bg-cyan-400 animate-ping"></span>
            SOLANA MEME & UTILITY TOKEN
        </div>
        <h1 class="font-orbitron text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-blue-600 mb-6 tracking-wide">
            DOMINATE THE OCEAN
        </h1>
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mb-8 leading-relaxed">
            The most lethal meme & utility ecosystem residing on Solana. Claim your early allocation and join the apex pod.
        </p>
        <div class="flex flex-wrap gap-4 justify-center">
            <button onclick="openAirdropModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold px-8 py-4 rounded-xl shadow-cyan-500/30 shadow-lg transition transform hover:-translate-y-0.5">
                🚀 Claim Airdrop Now
            </button>
        </div>
    </main>

    <!-- Airdrop Modal / Pop-up -->
    <div id="airdropModal" class="modal opacity-0 invisible pointer-events-none fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 modal-blur">
        <div class="bg-slate-900 border border-cyan-500/30 w-full max-w-md rounded-2xl p-6 relative shadow-2xl glow-box">
            <!-- Close Button -->
            <button onclick="closeAirdropModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h2 class="font-orbitron text-2xl font-bold text-cyan-400 mb-2">LethalOrca Airdrop</h2>
            <p class="text-slate-400 text-sm mb-6">Enter your details below to submit your wallet for the airdrop allocation.</p>

            <form id="airdropForm" class="space-y-4" onsubmit="handleAirdropSubmit(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 tracking-wider">SOLANA WALLET ADDRESS</label>
                    <input type="text" id="walletAddress" required placeholder="Enter your SOL wallet address" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 tracking-wider">X (TWITTER) HANDLE</label>
                    <input type="text" id="twitterHandle" placeholder="@username" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>
                
                <!-- Cloudflare Turnstile Container -->
                <div id="turnstileContainer" class="my-3"></div>

                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-3 rounded-lg transition mt-4 shadow-lg shadow-cyan-500/20">
                    Submit Airdrop Claim
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts Section -->
    <script>
        // Modal functions
        function openAirdropModal() {
            const modal = document.getElementById('airdropModal');
            if (modal) {
                modal.classList.add('modal-active');
            }
        }

        function closeAirdropModal() {
            const modal = document.getElementById('airdropModal');
            if (modal) {
                modal.classList.remove('modal-active');
            }
        }

        function handleAirdropSubmit(e) {
            e.preventDefault();
            alert("Airdrop submission received!");
            closeAirdropModal();
        }

        // ==========================================
        // AUTOMATIC DIRECT LINK AUTO-OPEN LOGIC
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Checks if ?airdrop=true OR #airdrop is in the URL
            if (urlParams.get('airdrop') === 'true' || window.location.hash === '#airdrop') {
                setTimeout(() => {
                    openAirdropModal();
                }, 400); // Small delay to allow full UI render
            }
        });
    </script>
</body>
</html>
