<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Play & Earn</title>

    <!-- Solana Web3 SDK (CDN) -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <!-- 1. CSS STYLES (Single File mein Design) -->
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #1b263b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        button {
            background-color: #00b4d8;
            color: #fff;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #90e0ef;
            color: #000;
        }

        .status-box {
            background: #415a77;
            padding: 10px;
            border-radius: 6px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐋 LethalOrca Web3 Panel</h1>
        
        <div class="status-box">
            <p>Wallet Status: <span id="walletStatus">Not Connected</span></p>
            <p>LORCA Balance: <span id="balance">0</span> LORCA</p>
        </div>

        <button id="connectBtn" onclick="connectPhantom()">Connect Phantom Wallet</button>
        <button id="claimBtn" onclick="claimGeneratedLorca()">Sign Tx & Transfer LORCA</button>
    </div>

    <!-- 2. JAVASCRIPT & WEB3 LOGIC (Single File mein Code) -->
    <script>
        // -------------------------------------------------------------
        // RPC SETUP (Public URL 403 deta hai, is liye Devnet ya Helius URL use karein)
        // -------------------------------------------------------------
        
        // Option A: Free Devnet Testing URL
        const RPC_URL = "https://api.devnet.solana.com"; 
        
        // Option B: Helius Mainnet URL (Jab Mainnet par shift hona ho to apni API Key dalein):
        // const RPC_URL = "https://mainnet.helius-rpc.com/?api-key=YOUR_HELIUS_API_KEY";

        const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');

        let userWalletAddress = null;

        // -------------------------------------------------------------
        // PHANTOM CONNECT FUNCTION
        // -------------------------------------------------------------
        async function connectPhantom() {
            try {
                if ("solana" in window) {
                    const provider = window.solana;
                    if (provider.isPhantom) {
                        const response = await provider.connect();
                        userWalletAddress = response.publicKey.toString();
                        
                        document.getElementById("walletStatus").innerText = "Connected: " + userWalletAddress.slice(0, 6) + "..." + userWalletAddress.slice(-4);
                        console.log("Connected Wallet:", userWalletAddress);
                    }
                } else {
                    alert("Phantom Wallet install nahi hai! Pehle Extension install karein.");
                }
            } catch (err) {
                console.error("Connection Error:", err);
            }
        }

        // -------------------------------------------------------------
        // CLAIM / TRANSFER FUNCTION (FIXED BLOCKHASH ERROR)
        // -------------------------------------------------------------
        async function claimGeneratedLorca() {
            if (!userWalletAddress) {
                alert("Pehle Wallet Connect Karein!");
                return;
            }

            try {
                console.log("Fetching Blockhash from RPC...");
                
                // 1. Get Latest Blockhash (403 error yahan aata tha jab public mainnet blocked ho)
                const { blockhash } = await connection.getLatestBlockhash('finalized');
                console.log("Blockhash fetched successfully:", blockhash);

                // 2. Transaction Create karein
                const transaction = new solanaWeb3.Transaction({
                    recentBlockhash: blockhash,
                    feePayer: window.solana.publicKey
                });

                // (Yahan aap ki LORCA Token transfer ki instructions ayegi)
                console.log("Sending Transaction to Phantom for Signature...");

                // 3. Phantom se sign karwayein
                const { signature } = await window.solana.signAndSendTransaction(transaction);
                console.log("Transaction Success Signature:", signature);

                alert("Transaction Successful! Hash: " + signature);

            } catch (error) {
                console.error("Transfer Error Details:", error);
                alert("Transaction Failed! Console (Ctrl+Shift+J) dekhein.");
            }
        }
    </script>
</body>
</html>
