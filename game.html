<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Play & Earn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b1d3a;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #10325d, #06101e);
            overflow: hidden;
            cursor: crosshair;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
            z-index: 10;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 25, 50, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .wallet-btn {
            background: #4facfe;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: #0b1d3a;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .wallet-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #102642;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            width: 320px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal h2 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .modal p {
            margin-bottom: 25px;
            color: #a0aec0;
            font-size: 14px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 18px;
            cursor: pointer;
        }

        .close-modal:hover {
            color: white;
        }

        /* Game Elements */
        .entity {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI -->
        <div class="ui-layer">
            <div class="stats-bar">
                <span>🐋</span>
                <span id="lorca-count">100</span>
                <span>LORCA</span>
                <span id="score">Score: 0</span>
            </div>
            <button class="wallet-btn" id="open-wallet">Connect Wallet</button>
        </div>
    </div>

    <!-- Wallet Modal -->
    <div class="modal-overlay" id="wallet-modal">
        <div class="modal">
            <button class="close-modal" id="close-wallet">✕</button>
            <h2>Wallet</h2>
            <p>Connect Phantom to claim LORCA</p>
            <button class="wallet-btn" id="connect-phantom" style="width: 100%;">Connect Phantom</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const lorcaDisplay = document.getElementById('lorca-count');
        const scoreDisplay = document.getElementById('score');
        
        let score = 0;
        let lorcaBalance = 100;

        // Player (Orca)
        const player = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            targetX: window.innerWidth / 2,
            targetY: window.innerHeight / 2,
            element: document.createElement('div')
        };

        player.element.className = 'entity';
        player.element.innerHTML = '🐋';
        player.element.style.fontSize = '48px';
        container.appendChild(player.element);

        // Track Mouse/Touch
        window.addEventListener('mousemove', (e) => {
            player.targetX = e.clientX;
            player.targetY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                player.targetX = e.touches[0].clientX;
                player.targetY = e.touches[0].clientY;
            }
        });

        // Entities (Fish & Pufferfish)
        const entities = [];
        const entityTypes = ['🐡', '🐟', '🐠'];

        function spawnEntity() {
            const el = document.createElement('div');
            const type = entityTypes[Math.floor(Math.random() * entityTypes.length)];
            el.className = 'entity';
            el.innerHTML = type;
            container.appendChild(el);

            const entityData = {
                element: el,
                x: Math.random() < 0.5 ? -50 : window.innerWidth + 50,
                y: Math.random() * window.innerHeight,
                speed: 1 + Math.random() * 2,
                direction: 0
            };

            entityData.direction = entityData.x < 0 ? 1 : -1;
            entities.push(entityData);
        }

        // Spawn initial entities
        for (let i = 0; i < 12; i++) {
            spawnEntity();
        }

        // Game Loop
        function update() {
            // Smooth player movement (Lerp)
            player.x += (player.targetX - player.x) * 0.1;
            player.y += (player.targetY - player.y) * 0.1;

            player.element.style.left = `${player.x}px`;
            player.element.style.top = `${player.y}px`;

            // Flip player based on direction
            if (player.targetX < player.x) {
                player.element.style.transform = 'translate(-50%, -50%) scaleX(-1)';
            } else {
                player.element.style.transform = 'translate(-50%, -50%) scaleX(1)';
            }

            // Update entities
            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.x += ent.speed * ent.direction;

                // Wrap around screen edges
                if (ent.direction > 0 && ent.x > window.innerWidth + 50) {
                    ent.x = -50;
                    ent.y = Math.random() * window.innerHeight;
                } else if (ent.direction < 0 && ent.x < -50) {
                    ent.x = window.innerWidth + 50;
                    ent.y = Math.random() * window.innerHeight;
                }

                ent.element.style.left = `${ent.x}px`;
                ent.element.style.top = `${ent.y}px`;
                
                if (ent.direction > 0) {
                    ent.element.style.transform = 'translate(-50%, -50%) scaleX(-1)';
                } else {
                    ent.element.style.transform = 'translate(-50%, -50%) scaleX(1)';
                }

                // Collision detection with player
                const dx = player.x - ent.x;
                const dy = player.y - ent.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 40) {
                    // Eat fish
                    container.removeChild(ent.element);
                    entities.splice(i, 1);
                    
                    score += 10;
                    lorcaBalance += 2;
                    scoreDisplay.innerText = `Score: ${score}`;
                    lorcaDisplay.innerText = lorcaBalance;

                    // Spawn replacement
                    setTimeout(spawnEntity, 1000);
                }
            }

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);

        // Modal Logic
        const modal = document.getElementById('wallet-modal');
        document.getElementById('open-wallet').addEventListener('click', () => {
            modal.classList.add('active');
        });
        document.getElementById('close-wallet').addEventListener('click', () => {
            modal.classList.remove('active');
        });
        document.getElementById('connect-phantom').addEventListener('click', () => {
            alert('Phantom Wallet connection simulated!');
            modal.classList.remove('active');
        });
    </script>
</body>
</html>
