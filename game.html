<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Play & Earn</title>

    <!-- Solana Web3 SDK -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Container for your game canvas */
        #gameCanvasArea {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: radial-gradient(circle, #1b263b 0%, #0d1b2a 100%);
            transition: filter 0.3s ease;
        }

        /* Blur effect before game starts */
        .game-locked {
            filter: blur(8px);
            pointer-events: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Hidden state that preserves game execution */
        .modal-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 440px;
            background: #1b263b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #415a77;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #e0e1dd;
        }

        .status-box {
            background: #0d1b2a;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #415a77;
            text-align: left;
        }

        .status-box p {
            margin: 8px 0;
            font-size: 14px;
            color: #778da9;
        }

        .status-val {
            font-weight: bold;
            color: #00b4d8;
            word-break: break-all;
        }

        .btn {
            background-color: #00b4d8;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            margin: 8px 0;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: #90e0ef;
            color: #0d1b2a;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background-color: #415a77;
            color: #778da9;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background-color: #2ec4b6;
        }

        .btn-start:hover {
            background-color: #cbf3f0;
            color: #0d1b2a;
        }
    </style>
</head>
<body>

    <!-- Game Screen Container (Insert your game canvas or HTML inside here) -->
    <div id="gameCanvasArea" class="game-locked">
        <h2 id="gameStatusText">Game Standby - Connect Wallet to Play</h2>
    </div>

    <!-- Web3 Control Panel Popup -->
    <div class="modal-overlay" id="web3Modal">
        <div class="container">
            <h1>🐋 LethalOrca Web3 Panel</h1>
            
            <div class="status-box">
                <p>Wallet Status: <span id="walletStatus" class="status-val">Not Connected</span></p>
                <p>LORCA Balance: <span id="balance" class="status-val">0</span> LORCA</p>
            </div>

            <button id="connectBtn" class="btn" onclick="connectPhantom()">Connect Phantom Wallet</button>
            <button id="startBtn" class="btn btn-start" onclick="startGame()" disabled>Start Game</button>
            <button id="claimBtn" class="btn" onclick="claimGeneratedLorca()" disabled>Sign Tx & Transfer LORCA</button>
        </div>
    </div>

    <script>
        // RPC Setup
        const RPC_URL = "https://api.devnet.solana.com"; 
        const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');

        let userWalletAddress = null;

        // Get Phantom Provider safely
        function getPhantomProvider() {
            if ("solana" in window) {
                const provider = window.solana;
                if (provider.isPhantom) {
                    return provider;
                }
            }
            return null;
        }

        // -------------------------------------------------------------
        // PHANTOM CONNECT FUNCTION
        // -------------------------------------------------------------
        async function connectPhantom() {
            const provider = getPhantomProvider();

            if (!provider) {
                alert("Phantom Wallet is not installed. Please install the browser extension first.");
                window.open("https://phantom.app/", "_blank");
                return;
            }

            try {
                const response = await provider.connect();
                userWalletAddress = response.publicKey.toString();
                
                // Update interface states
                document.getElementById("walletStatus").innerText = 
                    userWalletAddress.slice(0, 6) + "..." + userWalletAddress.slice(-4);
                
                document.getElementById("connectBtn").innerText = "Wallet Connected";
                document.getElementById("connectBtn").disabled = true;
                
                // Enable action buttons
                document.getElementById("startBtn").disabled = false;
                document.getElementById("claimBtn").disabled = false;

            } catch (err) {
                console.error("Connection Error:", err);
                alert("Failed to connect wallet. Please try again.");
            }
        }

        // -------------------------------------------------------------
        // START GAME FUNCTION (Smooth Unlocking)
        // -------------------------------------------------------------
        function startGame() {
            if (!userWalletAddress) {
                alert("Please connect your wallet first!");
                return;
            }

            // Smoothly hide popup overlay without destroying layout
            const modal = document.getElementById("web3Modal");
            modal.classList.add("modal-hidden");
            
            // Remove blur effect and activate input events on the game canvas
            const gameArea = document.getElementById("gameCanvasArea");
            gameArea.classList.remove("game-locked");
            
            document.getElementById("gameStatusText").innerText = "🎮 Game Active! Playing...";

            // Trigger game engine start sequence
            if (typeof onGameStart === "function") {
                onGameStart(userWalletAddress);
            }
        }

        // Callback function to integrate custom game logic
        function onGameStart(walletAddress) {
            console.log("Game initialized for wallet:", walletAddress);
            // Put your game engine launch code here (e.g., UnityInstance.SendMessage(...))
        }

        // -------------------------------------------------------------
        // CLAIM / TRANSACTION FUNCTION
        // -------------------------------------------------------------
        async function claimGeneratedLorca() {
            const provider = getPhantomProvider();

            if (!userWalletAddress || !provider) {
                alert("Please connect your wallet first!");
                return;
            }

            const claimBtn = document.getElementById("claimBtn");
            claimBtn.disabled = true;
            claimBtn.innerText = "Processing Transaction...";

            try {
                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('finalized');

                const transaction = new solanaWeb3.Transaction({
                    recentBlockhash: blockhash,
                    feePayer: provider.publicKey
                });

                // Standard transfer instruction for transaction execution
                transaction.add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: provider.publicKey,
                        toPubkey: provider.publicKey,
                        lamports: 1000
                    })
                );

                const { signature } = await provider.signAndSendTransaction(transaction);
                
                await connection.confirmTransaction({
                    blockhash: blockhash,
                    lastValidBlockHeight: lastValidBlockHeight,
                    signature: signature
                });

                alert("Transaction Successful!\nSignature: " + signature);

            } catch (error) {
                console.error("Transaction Error:", error);
                alert("Transaction canceled or failed.");
            } finally {
                claimBtn.disabled = false;
                claimBtn.innerText = "Sign Tx & Transfer LORCA";
            }
        }

        // Detect connected session on load
        window.addEventListener('load', () => {
            const provider = getPhantomProvider();
            if (provider && provider.isConnected && provider.publicKey) {
                userWalletAddress = provider.publicKey.toString();
                document.getElementById("walletStatus").innerText = 
                    userWalletAddress.slice(0, 6) + "..." + userWalletAddress.slice(-4);
                
                document.getElementById("connectBtn").innerText = "Wallet Connected";
                document.getElementById("connectBtn").disabled = true;
                document.getElementById("startBtn").disabled = false;
                document.getElementById("claimBtn").disabled = false;
            }
        });
    </script>
</body>
</html>
