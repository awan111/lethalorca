<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca - Auto Play & Earn</title>
    <!-- Solana Web3 SDK for Real Wallet Integration -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
            margin: 8px;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
        }

        .btn-airdrop {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .btn-airdrop:hover {
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
        }

        .wallet-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .wallet-btn:hover {
            background: #334155;
        }

        .game-arena {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
            z-index: 5;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bot-fisherman {
            font-size: 5rem;
            animation: bounceRod 1s infinite alternate ease-in-out;
            margin-bottom: 20px;
        }

        @keyframes bounceRod {
            0% { transform: rotate(0deg) translateY(0); }
            100% { transform: rotate(-5deg) translateY(-10px); }
        }

        .status-text {
            font-size: 1.5rem;
            color: #38bdf8;
            font-weight: bold;
            margin-top: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }

        .modal-content h2 {
            color: #00f2fe;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div id="scoreDisplay">0 LORCA</div>
        <div id="timerDisplay">30</div>
        <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
    </div>

    <!-- Main Menu -->
    <div class="container" id="mainMenu">
        <h1>🐋 LethalOrca</h1>
        <p>Auto-Bot Fishing! Click start and let the bot earn LORCA tokens for you.</p>
        <div>
            <button class="btn" id="startBtn">Start Auto Fishing</button>
            <button class="btn btn-airdrop" id="airdropBtn">🎁 Claim 200,000 Airdrop</button>
        </div>
    </div>

    <!-- Game Arena -->
    <div class="game-arena" id="gameArena">
        <div class="bot-fisherman">🎣🧑‍💻</div>
        <div class="status-text" id="botStatusText">Bot is catching fish... 🐟</div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>🎉 Congratulations!</h2>
            <p id="modalMessage">You earned 0 LORCA tokens!</p>
            <button class="btn" id="claimRewardBtn">Collect & Return</button>
        </div>
    </div>

    <!-- Wallet Modal -->
    <div class="modal" id="walletModal">
        <div class="modal-content">
            <h2>💼 Phantom Wallet</h2>
            <p id="walletStatus">Status: Not Connected</p>
            <p>Your Balance: <span id="walletBalance" style="color: #00f2fe; font-weight: bold;">0 LORCA</span></p>
            <div>
                <button class="btn" id="connectPhantomBtn">Connect Phantom</button>
                <button class="btn btn-airdrop" id="withdrawBtn" style="display:none;">Withdraw Tokens</button>
            </div>
            <br>
            <button class="wallet-btn" id="closeWalletBtn">Close</button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const airdropBtn = document.getElementById('airdropBtn');
        const mainMenu = document.getElementById('mainMenu');
        const gameArena = document.getElementById('gameArena');
        const timerDisplay = document.getElementById('timerDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const walletBtn = document.getElementById('walletBtn');
        const botStatusText = document.getElementById('botStatusText');
        
        const gameOverModal = document.getElementById('gameOverModal');
        const modalMessage = document.getElementById('modalMessage');
        const claimRewardBtn = document.getElementById('claimRewardBtn');

        const walletModal = document.getElementById('walletModal');
        const connectPhantomBtn = document.getElementById('connectPhantomBtn');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const walletStatus = document.getElementById('walletStatus');
        const walletBalance = document.getElementById('walletBalance');
        const closeWalletBtn = document.getElementById('closeWalletBtn');

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let fishingInterval;
        let userWalletAddress = null;

        // Helper function to get Phantom Provider
        const getProvider = () => {
            if ('solana' in window) {
                const provider = window.solana;
                if (provider.isPhantom) {
                    return provider;
                }
            }
            return null;
        };

        // Connect Real Phantom Wallet
        const connectWallet = async () => {
            const provider = getProvider();
            if (provider) {
                try {
                    const response = await provider.connect();
                    userWalletAddress = response.publicKey.toString();
                    
                    const shortenedAddress = userWalletAddress.slice(0, 4) + '...' + userWalletAddress.slice(-4);
                    walletStatus.textContent = `Connected: ${shortenedAddress}`;
                    walletBtn.textContent = shortenedAddress;
                    
                    connectPhantomBtn.style.display = 'none';
                    withdrawBtn.style.display = 'inline-block';
                    alert(`Phantom Wallet Connected!\nAddress: ${userWalletAddress}`);
                } catch (err) {
                    console.error(err);
                    alert("Connection rejected by user!");
                }
            } else {
                alert("Phantom Wallet extension not found! Please install Phantom from https://phantom.app");
                window.open("https://phantom.app/", "_blank");
            }
        };

        connectPhantomBtn.addEventListener('click', connectWallet);

        // Start Auto Fishing
        startBtn.addEventListener('click', () => {
            mainMenu.style.display = 'none';
            gameArena.style.display = 'flex';
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = `${score} LORCA`;
            timerDisplay.textContent = timeLeft;

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    clearInterval(fishingInterval);
                    gameArena.style.display = 'none';
                    
                    modalMessage.textContent = `Amazing job! Your automated bot successfully caught fish and earned ${score} LORCA tokens.`;
                    gameOverModal.style.display = 'flex';
                }
            }, 1000);

            fishingInterval = setInterval(() => {
                score += 10;
                scoreDisplay.textContent = `${score} LORCA`;
                
                const fishes = ['🐟', '🐠', '🐡', '🦈'];
                const randomFish = fishes[Math.floor(Math.random() * fishes.length)];
                botStatusText.textContent = `Bot caught a ${randomFish}! (+10 LORCA)`;
            }, 600);
        });

        // 2 Lakh Airdrop
        airdropBtn.addEventListener('click', () => {
            score += 200000;
            scoreDisplay.textContent = `${score} LORCA`;
            walletBalance.textContent = `${score} LORCA`;
            alert("🎁 Success! 200,000 LORCA Airdrop has been added to your balance!");
        });

        claimRewardBtn.addEventListener('click', () => {
            gameOverModal.style.display = 'none';
            mainMenu.style.display = 'block';
            walletBalance.textContent = `${score} LORCA`;
        });

        walletBtn.addEventListener('click', () => {
            walletModal.style.display = 'flex';
            walletBalance.textContent = `${score} LORCA`;
        });

        closeWalletBtn.addEventListener('click', () => {
            walletModal.style.display = 'none';
        });

        // Withdraw Request
        withdrawBtn.addEventListener('click', () => {
            if (score <= 0) {
                alert("You don't have enough balance to withdraw!");
            } else {
                alert(`🚀 Withdrawal request of ${score} LORCA sent to ${userWalletAddress}!`);
                score = 0;
                scoreDisplay.textContent = `${score} LORCA`;
                walletBalance.textContent = `${score} LORCA`;
                walletModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
