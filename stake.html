<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethal Orca Staking Withdrawal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #2c2c2c; color: #fff; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc99; }
        .stake-card { background: #2a2a2a; padding: 15px; margin-top: 15px; border-radius: 8px; border-left: 5px solid #00ffcc; }
        .error { color: #ff4d4d; margin-top: 10px; }
        .success { color: #00ffcc; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Lethal Orca - Staking Dashboard</h2>
        <p>Apna Wallet Address enter kar ke apne stakes check karein:</p>
        
        <input type="text" id="walletInput" placeholder="Enter Wallet Address (e.g., 3bveeb...)" value="3bveebwJQgzrj8GFEwXExbDZuZEexQuNmi7bKXAbdndE">
        <button onclick="fetchStakes()">Load My Stakes</button>

        <div id="message"></div>
        <div id="stakesList"></div>
    </div>

    <script>
        async function fetchStakes() {
            const wallet = document.getElementById('walletInput').value.trim();
            const messageDiv = document.getElementById('message');
            const stakesListDiv = document.getElementById('stakesList');
            
            messageDiv.innerHTML = "";
            stakesListDiv.innerHTML = "Loading...";

            if (!wallet) {
                messageDiv.innerHTML = "<p class='error'>Please enter a valid wallet address!</p>";
                stakesListDiv.innerHTML = "";
                return;
            }

            try {
                // Backend API call to get stakes (Aap ko backend par yeh route banana hoga jo DB se stakes laye)
                const response = await fetch(`http://localhost:5000/api/stakes?wallet=${wallet}`);
                const data = await response.json();

                if (!data.success || data.stakes.length === 0) {
                    stakesListDiv.innerHTML = "<p>No active stakes found for this wallet.</p>";
                    return;
                }

                stakesListDiv.innerHTML = "";
                data.stakes.forEach(stake => {
                    const card = document.createElement('div');
                    card.className = 'stake-card';
                    card.innerHTML = `
                        <p><b>Amount:</b> ${stake.amount} LORCA</p>
                        <p><b>Days:</b> ${stake.days} | <b>APR:</b> ${stake.apr}%</p>
                        <p><b>Status:</b> ${stake.status}</p>
                        <p><b>Created At:</b> ${new Date(stake.createdAt).toLocaleString()}</p>
                        ${stake.status === 'active' ? `<button onclick="withdrawStake('${stake._id}', '${wallet}')">Withdraw / Claim</button>` : '<span style="color:gray;">Withdrawn</span>'}
                    `;
                    stakesListDiv.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                stakesListDiv.innerHTML = "<p class='error'>Failed to connect to backend server.</p>";
            }
        }

        async function withdrawStake(stakeId, wallet) {
            if (!confirm("Kya aap apna stake withdraw karna chahte hain?")) return;

            try {
                const response = await fetch('http://localhost:5000/api/withdraw-stake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stakeId, wallet })
                });

                const result = await response.json();
                const messageDiv = document.getElementById('message');

                if (result.success) {
                    messageDiv.innerHTML = `<p class='success'>${result.message}</p>`;
                    fetchStakes(); // Refresh list
                } else {
                    messageDiv.innerHTML = `<p class='error'>Error: ${result.error}</p>`;
                }
            } catch (error) {
                console.error(error);
                alert("Withdrawal request failed!");
            }
        }
    </script>

</body>
</html>
